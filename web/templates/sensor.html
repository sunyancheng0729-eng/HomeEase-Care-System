<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HomeEase · 传感器接入</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/static/style.css"><link rel="stylesheet" href="/static/elder.css"><script defer src="/static/vendor/lucide.min.js"></script><script defer src="/static/sensor.js"></script></head><body class="sensor-body"><header class="elder-header"><a class="brand" href="/"><span class="brand-mark"><i data-lucide="house-heart"></i></span><span>HomeEase<small>实时传感器</small></span></a><a href="/#monitor" class="button secondary"><i data-lucide="arrow-left"></i>监测工作台</a></header><main class="sensor-main"><div class="eyebrow">ACCELEROMETER</div><h1>加速度数据接入</h1><div class="sensor-warning" id="sensorWarning" hidden></div><div class="sensor-connection"><span class="dot amber" id="sensorDot"></span><strong id="sensorConnection">未连接</strong></div><div class="sensor-controls"><button class="button primary" id="connectSensor"><i data-lucide="cable"></i>建立数据连接</button><button class="button secondary" id="disconnectSensor" disabled><i data-lucide="square"></i>停止输入</button></div><div class="sensor-values"><div><span>X 轴 · g</span><strong id="sensorX">--</strong></div><div><span>Y 轴 · g</span><strong id="sensorY">--</strong></div><div><span>Z 轴 · g</span><strong id="sensorZ">--</strong></div></div><div class="sensor-meta"><div><span class="muted">数据采样频率</span><strong id="sensorRate">-- Hz</strong></div><div><span class="muted">跌倒概率</span><strong id="sensorProb">--</strong></div></div><section class="sensor-input"><h2>设备数据流</h2><label style="margin-top:20px">样本批次 · [时间（秒）, X（g）, Y（g）, Z（g）]<textarea id="sensorSamples" rows="5" placeholder='[[0,0,0,1],[0.02,0.01,0,1.01]]'></textarea></label><button class="button secondary" id="sendSamples"><i data-lucide="send"></i>提交数据批次</button></section></main><div class="toast" id="toast" role="status" hidden></div></body></html>
